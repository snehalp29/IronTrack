services:
  postgres:
    image: postgres:15.17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-irontrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    env_file:
      - .env.docker
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"const http=require('node:http'); const port=Number(process.env.API_PORT ?? '4000'); const prefix=(process.env.API_PREFIX ?? 'api/v1').trim().replace(/^\\/+|\\/+$/g, ''); const req=http.get({ host: '127.0.0.1', port, path: '/' + prefix + '/health' }, (res) => { process.exit(res.statusCode && res.statusCode >= 200 && res.statusCode < 400 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => { req.destroy(); process.exit(1); });\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        VITE_API_URL: ${DOCKER_VITE_API_URL:-http://localhost:4000/api/v1}
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
