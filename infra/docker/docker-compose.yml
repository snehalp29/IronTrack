services:
  postgres:
    image: postgres:15.17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-irontrack}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3000}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3001},http://127.0.0.1:${WEB_PORT:-3001},http://localhost:5173,http://localhost:8081
      GOOGLE_CALLBACK_URL: http://localhost:${API_PORT:-3000}/${API_PREFIX:-api/v1}/auth/google/callback
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: build
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      API_PORT: ${API_PORT:-3000}
      GOOGLE_CALLBACK_URL: http://localhost:${API_PORT:-3000}/${API_PREFIX:-api/v1}/auth/google/callback
    command: sh -c "corepack enable && (pnpm --filter @irontrack/api exec prisma migrate resolve --rolled-back 202603050003_refresh_token_hash_unique || true) && pnpm --filter @irontrack/api exec prisma migrate deploy"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
    environment:
      VITE_API_URL: ${DOCKER_VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - '${WEB_PORT:-3000}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
