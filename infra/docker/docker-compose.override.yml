services:
  api:
    build:
      target: deps
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @irontrack/api dev"
    volumes:
      - ../..:/app
    environment:
      NODE_ENV: development

  web:
    build:
      target: build
    command: sh -c "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @irontrack/web dev --host 0.0.0.0 --port 80"
    volumes:
      - ../..:/app
