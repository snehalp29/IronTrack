name: Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker configuration
        run: bash tools/scripts/validate-docker.sh

      - name: Build API image
        run: docker build -f infra/docker/Dockerfile.api -t irontrack-api:latest .

      - name: Build web image
        run: docker build -f infra/docker/Dockerfile.web -t irontrack-web:latest .
